<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteScreen</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
header{padding:14px 18px;background:#1b1b1b;display:flex;justify-content:space-between}
#status{font-size:14px;color:#aaa}
main{display:flex;justify-content:center;padding:18px}
#screen{max-width:100%;max-height:88vh;object-fit:contain;background:#000}
</style>
</head>
<body>
<header><b>RemoteScreen</b><span id="status">Menghubungkan...</span></header>
<main><img id="screen" alt="Layar HP"></main>
<script>
const statusEl=document.getElementById('status'), img=document.getElementById('screen');
let ws;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws/view`);
  ws.binaryType="blob";
  ws.onopen=()=>{statusEl.textContent="Viewer terhubung";};
  ws.onclose=()=>{statusEl.textContent="Terputus — mencoba lagi";setTimeout(connect,1500);};
  ws.onerror=()=>statusEl.textContent="Error koneksi";
  ws.onmessage=e=>{
    if(typeof e.data==="string") return;
    const url=URL.createObjectURL(e.data), old=img.dataset.url;
    img.src=url; img.dataset.url=url;
    if(old) URL.revokeObjectURL(old);
    statusEl.textContent="LIVE";
  };
}
connect();
</script>
</body>
</html>
