<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteScreen Text Test</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
header{padding:14px 18px;background:#1b1b1b;display:flex;justify-content:space-between}
#status{font-size:14px;color:#aaa}
main{padding:30px;max-width:1000px;margin:auto}
#text{background:#000;border:1px solid #333;border-radius:10px;padding:24px;min-height:220px;font-size:32px;white-space:pre-wrap;word-break:break-word}
#hint{color:#aaa;margin-bottom:14px}
</style>
</head>
<body>
<header><b>RemoteScreen — Text Test</b><span id="status">Menghubungkan...</span></header>
<main>
<div id="hint">Ketik sesuatu di HP. Teks akan tampil di sini.</div>
<div id="text"></div>
</main>
<script>
const statusEl=document.getElementById('status');
const textEl=document.getElementById('text');
let ws;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws/view`);
  ws.onopen=()=>{statusEl.textContent="Viewer terhubung";};
  ws.onclose=()=>{statusEl.textContent="Terputus — mencoba lagi";setTimeout(connect,1500);};
  ws.onerror=()=>{statusEl.textContent="Error koneksi";};
  ws.onmessage=e=>{
    if(typeof e.data !== "string") return;
    if(e.data.startsWith("TEXT:")) {
      textEl.textContent=e.data.substring(5);
      statusEl.textContent="LIVE";
    }
  };
}
connect();
</script>
</body>
</html>
